[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentforge-brain-plugin"
version = "1.0.0"
description = "Test rig for tapps-brain save/recall round-trip (Wave B — requires live sidecar)."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "pydantic>=2.0"]

[project.entry-points."agentforge.plugins"]
brain-test = "agentforge_brain_test"

[tool.hatch.build.targets.wheel]
packages = ["agentforge_brain_test"]

[tool.hatch.build.targets.wheel.force-include]
"agentforge_brain_test/plugin.json" = "agentforge_brain_test/plugin.json"
"agentforge_brain_test/agents/brain_test_agent/AGENT.md" = "agentforge_brain_test/agents/brain_test_agent/AGENT.md"

[dependency-groups]
dev = ["pytest>=9.0", "httpx>=0.28"]
